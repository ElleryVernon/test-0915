services:
  db:
    image: postgres:18.6-alpine
    container_name: memoryz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: memoryz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memoryz_local_only}
      POSTGRES_DB: memoryz
    ports:
      - '127.0.0.1:15444:5432'
    volumes:
      - memoryz_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U memoryz -d memoryz']
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  memoryz_pgdata:
